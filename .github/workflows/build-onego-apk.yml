name: Build OneGo BackLoad APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-onego-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Set app version and prepare signing key
        env:
          ONEGO_KEYSTORE_BASE64: ${{ secrets.ONEGO_KEYSTORE_BASE64 }}
          ONEGO_KEYSTORE_PASSWORD: ${{ secrets.ONEGO_KEYSTORE_PASSWORD }}
          ONEGO_KEY_PASSWORD: ${{ secrets.ONEGO_KEY_PASSWORD }}
        run: |
          jq --argjson code "$GITHUB_RUN_NUMBER" --arg version "1.0.$GITHUB_RUN_NUMBER" \
            '.appVersionCode = $code | .appVersion = $version' \
            android/twa-manifest.json > android/twa-manifest.ci.json

          mkdir -p android
          if [ -n "$ONEGO_KEYSTORE_BASE64" ]; then
            if [ -z "$ONEGO_KEYSTORE_PASSWORD" ]; then
              echo "ONEGO_KEYSTORE_PASSWORD is required when ONEGO_KEYSTORE_BASE64 is set." >&2
              exit 1
            fi
            printf '%s' "$ONEGO_KEYSTORE_BASE64" | base64 --decode > android/android.keystore
            KEYSTORE_PASSWORD="$ONEGO_KEYSTORE_PASSWORD"
            KEY_PASSWORD="${ONEGO_KEY_PASSWORD:-$ONEGO_KEYSTORE_PASSWORD}"
            echo "Using the saved OneGo signing key."
          else
            KEYSTORE_PASSWORD="onego-test-$GITHUB_RUN_ID"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -v \
              -keystore android/android.keystore \
              -alias onego \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=One Go Business, OU=BackLoad, O=One Go Business, L=Amanzimtoti, ST=KwaZulu-Natal, C=ZA" \
              -noprompt
            echo "Using a temporary test key. Install this build as a first install; configure a saved keystore before making upgrade or Play Store builds."
          fi
          {
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure Bubblewrap SDK paths
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"

      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade --directory android --manifest android/twa-manifest.ci.json

      - name: Build signed APK
        working-directory: android
        run: bubblewrap build --skipPwaValidation --manifest twa-manifest.ci.json

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onego-backload-apk
          path: android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14